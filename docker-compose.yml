# i9Hub SaaS - Docker Compose para VPS Multi-Tenant
# Stack: PostgreSQL 16 (RLS), Redis 7, Evolution API, 9Router, i9Hub App

services:
  # ─── Reverse Proxy (Caddy com TLS automático) ───
  caddy:
    image: caddy:2-alpine
    container_name: i9hub_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - i9hub-app
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # ─── Banco de Dados Multi-Tenant ───
  postgres:
    image: postgres:16-alpine
    container_name: i9hub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-i9hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-i9hub_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-i9hub_saas}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-i9hub} -d ${POSTGRES_DB:-i9hub_saas}"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: postgres -c shared_buffers=256MB -c max_connections=50 -c effective_cache_size=512MB -c work_mem=4MB
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '1.0'

  # ─── Cache e Filas ───
  redis:
    image: redis:7-alpine
    container_name: i9hub_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # ─── Gateway WhatsApp Principal (Planos Pro/Enterprise) ───
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: i9hub_evolution_wa
    restart: unless-stopped
    environment:
      SERVER_URL: ${WA_GATEWAY_PUBLIC_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${WA_GATEWAY_API_KEY:-i9hub_wa_master_key}
      DATABASE_ENABLED: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://i9hub-app:3000/api/webhooks/whatsapp
      DELIVERY_TIMEOUT: "60000"
      MAX_INSTANCES_PER_CLIENT: "3"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1.2G
          cpus: '1.5'

  # ─── Gateway WhatsApp Compartilhado (Planos Basic/Starter via 9Router) ───
  9router:
    image: 9router/9router:latest
    container_name: i9hub_9router
    restart: unless-stopped
    environment:
      POOL_SIZE: "8"
      ROTATION_STRATEGY: "round_robin"
      HEALTH_CHECK_INTERVAL: "30"
      FALLBACK_ENABLED: "true"
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 800M
          cpus: '0.8'

  # ─── Aplicação SaaS (Node.js) ───
  i9hub-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: i9hub_saas_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-i9hub}:${POSTGRES_PASSWORD:-i9hub_secret_2026}@postgres:5432/${POSTGRES_DB:-i9hub_saas}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-i9hub_super_secret_jwt_key_change_in_production_2026}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      WA_GATEWAY_URL: http://evolution-api:8080
      WA_GATEWAY_API_KEY: ${WA_GATEWAY_API_KEY:-i9hub_wa_master_key}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RATE_LIMIT_BASIC: "100"
      RATE_LIMIT_PRO: "500"
      RATE_LIMIT_ENTERPRISE: "2000"
      PG_POOL_MIN: "2"
      PG_POOL_MAX: "20"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ─── Worker de Campanhas (BullMQ) ───
  i9hub-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: i9hub_worker
    restart: unless-stopped
    command: ["node", "backend/src/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-i9hub}:${POSTGRES_PASSWORD:-i9hub_secret_2026}@postgres:5432/${POSTGRES_DB:-i9hub_saas}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      WA_GATEWAY_URL: http://evolution-api:8080
      WA_GATEWAY_API_KEY: ${WA_GATEWAY_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ─── Monitoramento ───
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: i9hub_monitor
    restart: unless-stopped
    volumes:
      - kuma_data:/app/data
    ports:
      - "3001:3001"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  kuma_data:

networks:
  default:
    name: i9hub_network