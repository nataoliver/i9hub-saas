<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>i9Hub SaaS - Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-container { width: 100%; max-width: 420px; padding: 20px; }
    .login-card { background: #1e293b; border-radius: 16px; padding: 40px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo h1 { font-size: 28px; font-weight: 700; color: #10b981; letter-spacing: -0.5px; }
    .logo p { color: #94a3b8; font-size: 14px; margin-top: 8px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 14px; font-weight: 500; color: #cbd5e1; margin-bottom: 8px; }
    .form-input { width: 100%; padding: 14px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #f1f5f9; font-size: 15px; transition: border-color 0.2s, box-shadow 0.2s; outline: none; }
    .form-input:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.15); }
    .form-input::placeholder { color: #64748b; }
    .btn-login { width: 100%; padding: 16px; background: #10b981; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .btn-login:hover { background: #059669; }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg { background: rgba(239,68,68,0.15); color: #fca5a5; padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; display: none; }
    .error-msg.visible { display: block; }
    .footer { text-align: center; margin-top: 24px; color: #64748b; font-size: 13px; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo">
        <h1>i9Hub</h1>
        <p>Plataforma SaaS Multi-Tenant</p>
      </div>
      <div id="error-msg" class="error-msg"></div>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">E-mail</label>
          <input type="email" id="email" class="form-input" placeholder="seu@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Senha</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" id="btn-login" class="btn-login">Entrar</button>
      </form>
      <div class="footer">
        <p>Acesso restrito a clientes autorizados.</p>
      </div>
    </div>
  </div>
  <script type="module">
    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const btnLogin = document.getElementById('btn-login');
    const errorMsg = document.getElementById('error-msg');

    // Se já tem token, redirecionar
    if (localStorage.getItem('i9hub_jwt')) {
      window.location.href = '/sidepanel/sidepanel.html';
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('visible');
    }

    function hideError() {
      errorMsg.classList.remove('visible');
    }

    function setLoading(loading) {
      btnLogin.disabled = loading;
      btnLogin.innerHTML = loading ? '<span class="spinner"></span>Entrando...' : 'Entrar';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      setLoading(true);

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!email || !password) {
        showError('Preencha todos os campos.');
        setLoading(false);
        return;
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (data.success && data.data?.token) {
          localStorage.setItem('i9hub_jwt', data.data.token);
          window.location.href = '/sidepanel/sidepanel.html';
        } else {
          showError(data.error || 'Credenciais inválidas.');
        }
      } catch (err) {
        showError('Erro de conexão. Tente novamente.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
